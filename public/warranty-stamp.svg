<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <!-- Top and bottom arc paths for curved WARRANTY text -->
    <path id="topWarrantyArc" d="M 76,200 A 124,124 0 1,1 324,200" />
    <path id="bottomWarrantyArc" d="M 332,200 A 132,132 0 1,1 68,200" />
  </defs>

  <rect width="400" height="400" rx="24" fill="#FFFFFF" />

  <!-- Outer & Inner Red Stamp Rings -->
  <circle cx="200" cy="200" r="174" stroke="#C81010" stroke-width="10" />
  <circle cx="200" cy="200" r="158" stroke="#C81010" stroke-width="4" />
  <circle cx="200" cy="200" r="102" stroke="#C81010" stroke-width="6" />
  <circle cx="200" cy="200" r="91" stroke="#C81010" stroke-width="3" />

  <!-- Top Curved Text: WARRANTY -->
  <text fill="#C81010" font-family="'Plus Jakarta Sans', 'Arial Black', Impact, sans-serif" font-weight="900" font-size="38" letter-spacing="5">
    <textPath href="#topWarrantyArc" startOffset="50%" text-anchor="middle">WARRANTY</textPath>
  </text>

  <!-- Bottom Curved Text: WARRANTY -->
  <text fill="#C81010" font-family="'Plus Jakarta Sans', 'Arial Black', Impact, sans-serif" font-weight="900" font-size="38" letter-spacing="5">
    <textPath href="#bottomWarrantyArc" startOffset="50%" text-anchor="middle">WARRANTY</textPath>
  </text>

  <!-- 3 Stars in Upper Inner Semicircle -->
  <g fill="#C81010">
    <!-- Center Top Star (Larger) -->
    <polygon points="200,115 206,128 220,130 210,140 212,154 200,147 188,154 190,140 180,130 194,128" transform="rotate(-12 200 135)" />
    <!-- Left Top Star -->
    <polygon points="154,132 158,141 168,142 161,149 163,158 154,154 145,158 147,149 140,142 150,141" transform="rotate(-22 154 145)" />
    <!-- Right Top Star -->
    <polygon points="244,122 248,131 258,132 251,139 253,148 244,144 235,148 237,139 230,132 240,131" transform="rotate(8 244 135)" />

    <!-- 3 Stars in Lower Inner Semicircle -->
    <!-- Center Bottom Star (Larger) -->
    <polygon points="212,248 218,261 232,263 222,273 224,287 212,280 200,287 202,273 192,263 206,261" transform="rotate(-10 212 268)" />
    <!-- Left Bottom Star -->
    <polygon points="166,252 170,261 180,262 173,269 175,278 166,274 157,278 159,269 152,262 162,261" transform="rotate(-18 166 265)" />
    <!-- Right Bottom Star -->
    <polygon points="256,235 260,244 270,245 263,252 265,261 256,257 247,261 249,252 242,245 252,244" transform="rotate(12 256 248)" />
  </g>

  <!-- Tilted Center Red Stamp Banner -->
  <g transform="rotate(-15 200 200)">
    <!-- White mask behind banner so rings don't bleed through -->
    <rect x="8" y="142" width="384" height="116" rx="18" fill="#FFFFFF" />
    <!-- Outer red border of stamp banner -->
    <rect x="12" y="146" width="376" height="108" rx="14" fill="#FFFFFF" stroke="#C81010" stroke-width="6" />
    <!-- Inner solid red stamp fill -->
    <rect x="20" y="154" width="360" height="92" rx="10" fill="#C81010" />
    <!-- Bold White WARRANTY Text -->
    <text x="200" y="219" text-anchor="middle" fill="#FFFFFF" font-family="'Plus Jakarta Sans', 'Arial Black', Impact, sans-serif" font-weight="900" font-size="54" letter-spacing="2">WARRANTY</text>
  </g>

  <!-- Subtle Grunge Stamp Texture Lines -->
  <g stroke="#FFFFFF" stroke-width="2" opacity="0.55" stroke-linecap="round">
    <line x1="65" y1="110" x2="120" y2="145" />
    <line x1="280" y1="85" x2="335" y2="130" />
    <line x1="95" y1="260" x2="155" y2="220" />
    <line x1="240" y1="170" x2="310" y2="255" />
    <line x1="145" y1="70" x2="195" y2="330" />
    <line x1="255" y1="65" x2="215" y2="340" />
  </g>
</svg>
